<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C2B" />
      <stop offset="50%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#D95305" />
    </linearGradient>

    <!-- Celestial Deep Globe Background -->
    <radialGradient id="globeGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="60%" stop-color="#0E1014" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>

    <!-- Warm Atmospheric Glow behind Logo -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#F47B20" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F47B20" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Depth -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="512" height="512" fill="#0A0B0E" />

  <!-- Outer Double Circle Rim -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#000000" stroke-width="4" />
  <circle cx="256" cy="256" r="236" fill="url(#globeGrad)" stroke="url(#ringGrad)" stroke-width="14" />

  <!-- Atmospheric Glow -->
  <circle cx="256" cy="230" r="190" fill="url(#centerGlow)" />

  <!-- Globe Curvature & Latitude Rings (Subtle Luxury Texture) -->
  <g stroke="#F4F2ED" stroke-width="0.8" opacity="0.12" fill="none">
    <ellipse cx="256" cy="210" rx="210" ry="80" />
    <ellipse cx="256" cy="210" rx="210" ry="140" />
    <ellipse cx="256" cy="210" rx="140" ry="210" />
    <line x1="46" y1="210" x2="466" y2="210" />
    <line x1="256" y1="20" x2="256" y2="400" />
  </g>

  <!-- Golden Nighttime Continental City Constellations -->
  <g fill="#FFB347" opacity="0.45">
    <!-- North America / Europe Cluster -->
    <circle cx="160" cy="120" r="2" /><circle cx="175" cy="115" r="1.5" /><circle cx="190" cy="125" r="2.2" />
    <circle cx="205" cy="110" r="1.8" /><circle cx="215" cy="130" r="2" /><circle cx="230" cy="105" r="2.5" />
    <circle cx="290" cy="115" r="2.2" /><circle cx="310" cy="125" r="1.8" /><circle cx="325" cy="140" r="2.4" />
    <!-- Africa / Middle East / Asia Cluster -->
    <circle cx="300" cy="180" r="2.5" /><circle cx="340" cy="170" r="1.8" /><circle cx="360" cy="195" r="2" />
    <circle cx="150" cy="190" r="1.5" /><circle cx="170" cy="210" r="2.2" />
  </g>

  <!-- Central "V" & Microphone Emblem Scaled at Center (256, 172) -->
  <g transform="translate(128, 44) scale(1.0)" filter="url(#markShadow)">
    <!-- Left Arm of V (Pure White) -->
    <polygon points="28.0,44.7 82.0,44.7 128.0,124.4 128.0,217.9" fill="#F4F2ED" />

    <!-- Right Arm of V (Electric Orange) -->
    <polygon points="228.0,44.7 174.0,44.7 128.0,124.4 128.0,217.9" fill="#F47B20" />

    <!-- Studio Microphone Capsule (Electric Orange) -->
    <path d="M 103.0,57.0 C 103.0,38.1 153.0,38.1 153.0,57.0 L 153.0,91.9 L 103.0,91.9 Z" fill="#F47B20" />

    <!-- Precision Triangular Base -->
    <polygon points="109.24,91.9 146.76,91.9 128.0,124.4" fill="#F47B20" />

    <!-- Acoustic Grille Cutout Slits -->
    <rect x="109.0" y="48.0" width="38.0" height="4.5" rx="2.2" fill="#111214" />
    <rect x="107.0" y="59.0" width="42.0" height="4.5" rx="2.2" fill="#111214" />
    <rect x="107.0" y="70.0" width="42.0" height="4.5" rx="2.2" fill="#111214" />
    <rect x="109.0" y="81.0" width="38.0" height="4.5" rx="2.2" fill="#111214" />

    <!-- Acoustic Shockmount Collar -->
    <path d="M 97.0,89.0 C 97.0,109.0 159.0,109.0 159.0,89.0 L 154.5,89.0 C 154.5,104.5 101.5,104.5 101.5,89.0 Z" fill="#F47B20" />
  </g>

  <!-- Typography: VIRALMIC -->
  <g transform="translate(256, 344)" text-anchor="middle" filter="url(#markShadow)">
    <text font-family="'Montserrat', 'Archivo', 'Arial Black', sans-serif" font-weight="900" font-size="56" letter-spacing="3">
      <tspan fill="#F4F2ED">VIRAL</tspan><tspan fill="#F47B20">MIC</tspan>
    </text>
  </g>

  <!-- Tagline: Big Conversations. Powerful Perspectives. -->
  <g transform="translate(256, 386)" text-anchor="middle">
    <!-- Divider Rules -->
    <line x1="84" y1="-8" x2="148" y2="-8" stroke="#F47B20" stroke-width="2.5" stroke-linecap="round" />
    <line x1="364" y1="-8" x2="428" y2="-8" stroke="#F47B20" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Line 1: Big Conversations. -->
    <text y="-2" font-family="'Playfair Display', 'Georgia', serif" font-style="italic" font-weight="700" font-size="23" fill="#F4F2ED" letter-spacing="0.5">Big Conversations.</text>
    <!-- Line 2: Powerful Perspectives. -->
    <text y="24" font-family="'Playfair Display', 'Georgia', serif" font-style="italic" font-weight="700" font-size="23" fill="#F47B20" letter-spacing="0.5">Powerful Perspectives.</text>
  </g>
</svg>
