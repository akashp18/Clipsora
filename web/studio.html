<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipsora Studio</title>
<meta name="description" content="Clipsora turns long conversations into finished vertical clips: edit, brand, cover and publish from one studio.">
<link rel="icon" href="/brand/favicon.svg">
<link rel="stylesheet" href="/assets/studio.css">
</head>
<body>
<a class="skip" href="#view">Skip to the workspace</a>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Studio">
    <a class="brand" href="#/create" aria-label="Clipsora Studio, new project">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 6.5 23 16 9 25.5V6.5Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 16h14" stroke="currentColor" stroke-width="1.2" opacity=".55"/></svg>
      </span>
      <span class="brand-word">Clipsora<em>Studio</em></span>
    </a>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="rail-foot">
      <div class="rail-status" id="rail-status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="rail-status-text">Connecting…</span>
      </div>
      <div class="rail-links">
        <a href="/classic" title="Live recording, creator profiles and Style Learner">Classic workspace</a>
        <a href="/privacy">Privacy</a>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button class="icon-btn rail-toggle" id="rail-toggle" aria-label="Open navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <div class="crumbs" id="crumbs" aria-label="Breadcrumb"></div>
      <div class="topbar-end">
        <span class="ai-pill" id="ai-pill" hidden></span>
        <a class="icon-btn" href="/classic" title="Classic workspace" aria-label="Classic workspace">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4zM8 18v2h8v-2" stroke="currentColor" stroke-width="1.4"/><path d="m10 9 5 3-5 3V9Z" fill="currentColor"/></svg>
        </a>
        <span class="avatar" id="avatar" title="Signed in">S</span>
      </div>
    </header>

    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript><p class="noscript">Clipsora Studio needs JavaScript. The <a href="/classic">classic workspace</a> is still available.</p></noscript>
<script type="module" src="/assets/studio.js"></script>
</body>
</html>
