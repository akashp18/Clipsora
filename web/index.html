<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* Clipsora 2.0 opens in Cinema Obsidian Dark by default, with 1-click toggle to Studio Porcelain Light. */try{var t=localStorage.getItem("pc-theme-v2");if(t!=="light"&&t!=="dark")t="dark";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
<title>Clipsora 2.0</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css?v=20">
<style>
/* Colour, radius and theme tokens live in /assets/tokens.css so every page reads the same values. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:var(--fs-body)/var(--lh-body) var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
::selection{background:var(--brand-line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{letter-spacing:-.012em;font-family:var(--font-display)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--hover);border-radius:999px;border:3px solid var(--surface)}

/* ---------- frame */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100vh}
.side{background:var(--frame);color:var(--frame-text);display:flex;flex-direction:column;height:100vh;padding:var(--sp-4) var(--sp-3) var(--sp-3);min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3) var(--sp-6)}
.side-head .logo{height:36px;width:auto;display:block}
.side-head .mark{display:none;width:34px;height:34px}
/* the product wordmark: the mark, then the name in the interface face so it always matches the theme */
.wordmark{display:flex;align-items:center;gap:var(--sp-2);font-family:var(--font-display);font-size:var(--fs-h3);font-weight:700;letter-spacing:-.03em;color:var(--frame-text);min-width:0}
.wordmark img{width:26px;height:26px;flex:none;display:block}
.wordmark span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--dim);cursor:pointer;flex:none}
.side .icon-btn{color:var(--frame-dim)}
.icon-btn:active{background:var(--muted)}.side .icon-btn:active{background:var(--frame-2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav h4{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--frame-dim);padding:var(--sp-5) var(--sp-3) var(--sp-2)}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 var(--sp-3);border-radius:var(--r-sm);border:0;background:transparent;color:var(--frame-text);font-size:var(--fs-sm);font-weight:500;cursor:pointer;text-align:left}
.nav-item svg{width:17px;height:17px}
.nav-item svg{color:var(--frame-dim)}
.nav-item:active{background:var(--frame-2)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-item.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-item.on svg{color:var(--accent)}
.label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--frame-chip);color:var(--frame-text);white-space:nowrap}
.nav-item.on .count{background:var(--accent-line);color:var(--accent-text)}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(var(--accent-rgb),.18);color:var(--accent-2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
img.avatar{object-fit:cover;background:var(--frame-hover)}
.tav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
#title{display:flex;align-items:center;gap:10px}
.chprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);animation:rise .25s ease both}
.chprev img,.chprev .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--hover)}
.chprev b{display:block;font-size:14px;color:var(--text)}
.chprev span{font-size:12px;color:var(--faint)}
.chprev.bad{background:var(--bad-soft);color:var(--bad-text);font-size:13px}
.chprev .sk{width:120px}
.nav-item.on .avatar{background:var(--brand-ink);color:var(--brand)}
.nav-item.on img.avatar{background:var(--brand-ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite;flex:none}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--frame-line)}
.side-card{background:var(--frame-2);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:12px;color:var(--frame-dim);display:flex;flex-direction:column;gap:7px}
.side-card div{display:flex;align-items:center;gap:9px}
.led{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}.led.no{background:var(--bad)}.led.mid{background:var(--brand)}
.plans-btn{margin-top:10px;width:100%;background:var(--frame-text);color:var(--brand-ink);border:0}
.scrim{display:none}

main{background:var(--bg);border:1px solid var(--line);margin:8px 8px 8px 0;border-radius:var(--r-lg);height:calc(100vh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-7);min-height:60px;border-bottom:1px solid var(--line);transition:border-color .2s ease}
.topbar.stuck{border-color:var(--line)}
#vbanner:empty{display:none}
.upd{display:grid;gap:14px}
.upd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--text);max-height:180px;overflow:auto}
.upd ul small{color:var(--dim)}
.upd .cmd{display:flex;gap:8px;align-items:center}
.upd .cmd code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--muted);border-radius:8px;padding:9px 11px}
.upd h3{font-size:13px;font-weight:600;color:var(--text);margin:0}
.vb{display:flex;align-items:center;gap:12px;margin:12px 28px 0;padding:12px 12px 12px 16px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);font-size:14px;animation:rise .3s ease both}
.vb svg{width:18px;height:18px;flex:none;color:var(--brand-deep)}
.vb span{flex:1;min-width:0}
.vb b{color:var(--brand-text)}
@media (max-width:640px){.vb{margin:10px 16px 0;flex-wrap:wrap}}
.topbar .titles{flex:1;min-width:0}
#tpic:empty{display:none}
#tpic img,#tpic .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;font-size:15px}
#tpic span.avatar{background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700}
#tpic.live img,#tpic.live .avatar{padding:2px;background:var(--surface);border:2px solid var(--live)}
.topbar.tabbed{border-color:var(--line)}
.topbar.tabbed .titles{flex:0 1 auto;max-width:34%}
.topbar.tabbed #actions{margin-left:auto}
.utabs:empty{display:none}
.utabs{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:11px;overflow-x:auto;scrollbar-width:none}
@media (min-width:761px){.topbar.tabbed{position:sticky}.topbar.tabbed .utabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.topbar.tabbed .titles{max-width:calc(50% - 230px)}}
@media (max-width:760px){.utabs{order:5;flex-basis:100%;margin:2px 0 0;position:relative}.topbar.tabbed .titles{max-width:none;flex:1}}
.utabs .tabbtn{height:34px;padding:0 14px;border-radius:8px;background:transparent;color:var(--dim);font-size:13px;transition:background-color .18s ease,color .18s ease}
.utabs .tabbtn:hover{background:var(--hover);color:var(--text)}
.utabs .tabbtn::after{display:none}
.utabs .tabbtn.on{background:transparent;color:#fff}
.utabs .tabbtn{position:relative;z-index:1}
.utabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--brand);z-index:0;transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.utabs .tabbtn,.utabs .tabbtn svg,.utabs .tabbtn .n{transition:color .25s ease,background-color .25s ease}
.utabs .tabbtn.on svg{color:#fff}
.utabs .tabbtn .n{background:var(--muted);color:var(--dim)}
.utabs .tabbtn.on .n{background:rgba(0,0,0,.22);color:#fff}
.rdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--surface)}
.btn .rdot.on{background:var(--live);animation:pulse 1.3s infinite}
/* live stream panel */
.stream{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px;background:var(--frame);border-radius:16px;padding:12px;margin-bottom:22px;color:var(--frame-text);animation:rise .3s ease both}
.stream .player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noembed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:var(--frame);color:var(--frame-text)}
.noembed .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.noembed .logo svg{width:22px;height:22px}
.noembed b{font-size:15px;color:var(--frame-text)}
.noembed span{font-size:13px;color:var(--faint-2);max-width:380px}
.noembed .btn{margin-top:6px}
.sinfo{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px 2px;min-width:0}
.sinfo .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinfo .logo{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sinfo .logo svg{width:16px;height:16px}
.sinfo .lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--live);color:var(--on-solid);padding:3px 10px;border-radius:999px}
.sinfo .lv i{width:6px;height:6px;border-radius:50%;background:var(--surface);animation:pulse 1.3s infinite}
.sinfo h3{font-size:16px;line-height:1.4;font-weight:600;color:var(--frame-text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sinfo .by{font-size:12px;color:var(--faint-2);margin-top:-6px}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.sstats div{background:var(--frame-hover);border-radius:10px;padding:10px 12px}
.sstats b{display:block;font-size:17px;font-weight:700;color:var(--frame-text);letter-spacing:-.01em}
.sstats span{font-size:11px;color:var(--faint-2)}
.sinfo .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sinfo .cta .btn{height:46px;width:100%;justify-content:center;font-size:15px}
.sinfo .cta small{font-size:12px;color:var(--faint-2);text-align:center}
.splat{display:flex;gap:4px;margin-left:auto}
.splat button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:var(--frame-hover);color:var(--faint-2);cursor:pointer;transition:background-color .15s ease}
.splat button:hover{background:rgba(255,255,255,.12)}
.splat button.on{background:rgba(var(--accent-rgb),.22)}
.splat svg{width:15px;height:15px}
@media (max-width:960px){.stream{grid-template-columns:1fr}}
.sbadge{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--muted);color:var(--dim)}
.sbadge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sbadge.live{background:var(--bad-soft);color:var(--bad-strong)}.sbadge.live i,.sbadge.rec i{animation:pulse 1.3s infinite}
.sbadge.rec{background:var(--live);color:var(--on-solid)}
.sbadge svg{width:12px;height:12px}
.sbadge{white-space:nowrap;max-width:100%}
.topbar .titles{overflow:hidden}
@media (max-width:560px){#tpic img,#tpic .avatar{width:36px;height:36px}.topbar #actions .btn[data-act=golive]{font-size:0;gap:0;width:38px;padding:0;justify-content:center}.topbar #actions .btn[data-act=golive] .rdot{width:12px;height:12px}}
.ttabs{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px}
.ttabs .tabbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--dim)}
.ttabs .tabbtn::after{display:none}
.ttabs .tabbtn svg{width:16px;height:16px}
.ttabs .tabbtn:hover{background:var(--hover);color:var(--text)}
.ttabs .tabbtn.on{background:var(--brand-soft);color:var(--text)}
.ttabs .tabbtn.on .n{background:var(--surface)}
#actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions a.btn{text-decoration:none}
@media (max-width:560px){#actions .btn .long{display:none}}
@media (max-width:900px){.ttabs .tabbtn .lbl{display:none}.ttabs .tabbtn{padding:0 10px}}
/* channels in Setup */
.chans{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);min-height:64px}
.chan .logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.chan .logo svg{width:20px;height:20px}
.chan .pic{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--hover)}
.chan .who{flex:1;min-width:0}
.chan .who b{display:block;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .who span{font-size:12px;color:var(--faint)}
.chan input{flex:1;min-width:0}
.chan .main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.chan .main input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.chan .sbadge{margin:0}
@media (max-width:640px){.chan{flex-wrap:wrap}.chan .main{order:5}}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.topbar p{font-size:12px;color:var(--dim);margin-top:0;overflow-wrap:anywhere}
.icon-btn.menu{display:none}
.content{padding:var(--sp-7) var(--sp-8) var(--sp-10);max-width:1320px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* ---------- collapsed sidebar */
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.app.mini .side-head{flex-direction:column;padding:2px 0 18px}
.app.mini .wordmark span{display:none}
.app.mini .wordmark img{width:28px;height:28px}
.app.mini .label,.app.mini .count,.app.mini .nav h4,.app.mini .side-card,.app.mini .plans-btn{display:none}
.app.mini .nav-item{justify-content:center;padding:0}
.app.mini .nav-item .live-dot{position:absolute;margin:-20px -22px 0 0}
.avatar.ring{border:2px solid var(--live);padding:1px;background-clip:content-box}
img.avatar.ring{background:transparent}
.sb-tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--bad-text);background:var(--bad-soft);padding:1px 7px 1px 6px;border-radius:var(--r-xs)}
.sb-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.sb-tag.rec{background:var(--live);color:var(--on-solid)}
.nav-item.on .sb-tag{background:var(--live);color:var(--on-solid)}
.app.mini .sb-tag{display:none}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 var(--sp-5);border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:500;font-size:var(--fs-sm)}
.btn:active{background:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:active{background:var(--brand-press);border-color:var(--brand-press)}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.dark svg{color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.icon{width:32px;padding:0}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- fields */
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea){width:100%;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);min-width:0;outline:none;transition:border-color var(--dur-1) ease}
:where(textarea){height:auto;padding:10px 12px;resize:vertical}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):hover{border-color:var(--line-2)}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):focus{background:var(--surface);border-color:var(--brand)}
input:not([type=checkbox],[type=radio],[type=range]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{height:auto;padding:10px 12px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-weight:600}
label.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--hover);position:relative;cursor:pointer;flex:none;margin:0}
label.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
label.sw input:checked{background:var(--brand)}label.sw input:checked::after{transform:translateX(16px)}
label.sw small{display:block;color:var(--dim);font-size:12px;font-weight:400}
label.ck{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:var(--r);cursor:pointer;background:var(--surface);border:1px solid var(--line-2);font-weight:500}
label.ck:has(input:checked){background:var(--brand-soft);border-color:var(--brand-line);color:var(--text)}
label.ck input{accent-color:var(--brand);margin:0}
[data-caption-style]:disabled{opacity:.45;cursor:default}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.span{grid-column:1/-1}

/* ---------- surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-6);margin-bottom:var(--sp-5)}
.card>h2,.card-head h2{font-size:15px;font-weight:600;color:var(--text)}
.card>h2{margin-bottom:4px}
.card>h2+.help{margin-bottom:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.help,.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-weight:600;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabbtn svg{width:17px;height:17px}
.tabbtn .n{font-size:11px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--muted);color:var(--dim);text-align:center;transition:background-color .15s ease,color .15s ease}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);opacity:0}
.tabbtn.on{color:var(--text)}
.tabbtn.on::after{opacity:1;animation:tabin .28s ease}
.tabbtn.on .n{background:var(--brand-soft);color:var(--text)}
.tabbtn.on svg{color:var(--brand)}
@keyframes tabin{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--muted);color:var(--dim);white-space:nowrap;text-decoration:none}
.pill.ok{color:var(--good);background:var(--good-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.warn{color:var(--brand-deep);background:var(--brand-soft)}
.pill.live{color:var(--on-solid);background:var(--live)}
.pill.brand{color:var(--brand-ink);background:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.3}}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface-2);padding:var(--sp-9) var(--sp-6);text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.empty img{width:56px;height:56px;margin-bottom:12px}
.empty b{display:block;color:var(--text);font-size:15px;font-weight:600}

/* ---------- home hero + composer */
.hero{position:relative;padding:var(--sp-8) var(--sp-7) var(--sp-6);text-align:center}
.hero .ga-bg{position:absolute;top:16px;bottom:-24px;left:0;width:100%;pointer-events:none;user-select:none;z-index:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%)}
.hero>:not(.ga-bg){position:relative;z-index:2}
#view{position:relative;z-index:1}
/* the one editorial serif line in the interface: the welcome over the composer */
.hero h2{font-family:var(--font-serif);font-size:clamp(27px,3.4vw,38px);font-weight:400;letter-spacing:0;color:var(--text);line-height:1.15;text-wrap:balance}
.hero>p{color:var(--dim);margin:var(--sp-3) auto var(--sp-6);max-width:520px;font-size:var(--fs-body)}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);text-align:left;transition:background-color .15s ease,border-color .15s ease}
.composer:has(#url:focus){border-color:var(--accent-2)}
.composer.compact{max-width:none;margin-bottom:28px;background:var(--muted)}
.composer.over{background:var(--brand-soft);border-color:var(--brand)}
.composer :focus-visible{outline:none}
.composer-input{position:relative;display:flex;align-items:center}
.composer-input>svg{position:absolute;left:18px;color:var(--faint);width:20px;height:20px;transition:color .15s ease}
.composer-input:focus-within>svg{color:var(--brand)}
.composer-input input,.composer-input input:focus{height:60px;border:0;background:transparent;padding:0 18px 0 48px;font-size:16px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.composer-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 10px 10px 12px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--muted);color:var(--dim);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.composer.compact .chip{background:var(--surface)}
.chip svg{width:16px;height:16px}
.chip:hover,.chip:focus-visible{background:var(--hover);color:var(--text)}
.chip.on,.pick.open .chip{background:var(--brand-soft);color:var(--text)}
.hint{font-size:12px;color:var(--faint);margin-right:6px}
.composer-bar{flex-wrap:nowrap}
.composer-bar .grow{display:none}
.composer-bar .hint{flex:1 1 0;min-width:0;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:560px){.composer-bar{flex-wrap:wrap}}
.composer-opts{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s ease,opacity .25s ease}
.composer-opts.open{grid-template-rows:1fr;opacity:1}
.composer-opts>.og{min-height:0;overflow:hidden;padding:0 12px;transition:padding .32s ease}
.composer-opts.open>.og{padding-bottom:12px}
/* the three openings for a clip: the hook, the title it would be posted with, and what makes it different */
.vars{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.var{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.var b{grid-column:1;font-size:13px;letter-spacing:.02em}
.var span{grid-column:1;font-size:12px;color:var(--dim)}
.var i{grid-column:1;font-size:11px;color:var(--dim);font-style:normal}
.var .btn{grid-column:2;grid-row:1 / span 3}

/* the caption editor: every word of the clip, small enough to see them all at once */
.capwords{display:flex;flex-wrap:wrap;gap:4px;max-height:200px;overflow:auto;padding:2px 0}
.capwords input{width:auto;min-width:54px;max-width:160px;padding:4px 6px;font-size:12px}

/* attachments: link preview and files */
.att{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.att.has{grid-template-rows:1fr}
.att>div{min-height:0;overflow:hidden}
.att-in{display:flex;flex-direction:column;gap:8px;padding:0 12px 8px}
.lp{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--muted);animation:rise .28s ease both}
.composer.compact .lp{background:var(--surface)}
.lp .th{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--text)}
.lp .th img{width:100%;height:100%;object-fit:cover;display:block}
.lp .th .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:var(--on-solid);font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
.lp .tx{min-width:0;flex:1}
.lp .tx b{display:block;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .tx span{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .ok{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);padding:4px 10px;border-radius:999px}
.lp .ok svg{width:14px;height:14px}
.lp .ok.live{background:var(--live);color:var(--on-solid)}
.lp .ok.live i{width:6px;height:6px;border-radius:50%;background:var(--surface);animation:pulse 1.3s infinite}
.lp.bad{background:var(--bad-soft);color:var(--bad-text);font-size:13px;padding:10px 12px}
.lp.bad>span{flex:1;min-width:0}
.lp.bad b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bad-text)}
.lp.wait .rm{margin-left:auto}
.lp.bad svg{width:16px;height:16px;flex:none}
.lp.wait .th,.sk{background:linear-gradient(90deg,var(--muted) 0%,var(--surface-2) 50%,var(--muted) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk{display:block;height:10px;border-radius:6px;margin:4px 0}
.lp{position:relative;overflow:hidden}
.lp .th video{width:100%;height:100%;object-fit:cover;display:block}
.lp .tx em{font-style:normal;color:var(--bad-text)}
.lp .ok.up{background:var(--brand-soft);color:var(--text);min-width:52px;justify-content:center}
.lp .rm{flex:none;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.lp .rm:hover,.lp .rm:focus-visible{background:var(--bad-soft);color:var(--bad-strong)}
.lp .rm svg{width:14px;height:14px}
.lp .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);transition:width .2s ease}
.addrow{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease;animation:rise .28s ease both}
.addrow:hover,.addrow:focus-visible{background:var(--brand-soft);color:var(--text)}
.addrow svg{width:16px;height:16px}
.addrow span{margin-left:auto;font-weight:500;color:var(--faint);font-size:12px}
@media (max-width:560px){.lp .th{width:88px}.lp .ok{display:none}}
.btn.primary:disabled{background:var(--hover);color:var(--faint-2);cursor:not-allowed}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.working{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--brand);background:rgba(var(--accent-rgb),.14);padding:2px 8px 2px 6px;border-radius:999px}
.working i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.nav-item.on .working{background:var(--accent-line);color:var(--accent-text)}
.app.mini .nav-item .working{display:none}

/* custom dropdown: a dark panel, no border or shadow needed against the white */
.pick{position:relative}
.pick .car{width:13px;height:13px;transition:transform .15s ease}
.pick.open .car{transform:rotate(180deg)}
.pick-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:230px;max-height:280px;overflow:auto;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:var(--shadow-2);border-radius:var(--r-lg);padding:var(--sp-2);
  opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s}
.pick.open .pick-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.pick-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--text);border-radius:8px;font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pick-opt:hover,.pick-opt:focus-visible{background:var(--hover);color:var(--text)}
.pick-new{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding:8px 10px;border:0;border-top:1px solid var(--frame-hover);border-radius:0 0 8px 8px;background:transparent;color:var(--accent-2);font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pick-new:hover,.pick-new:focus-visible{background:rgba(var(--accent-rgb),.14);color:var(--accent-2)}
.pick-new .av{background:rgba(var(--accent-rgb),.18)}
.pick-empty{margin:6px 10px 4px;font-size:12px;line-height:1.45;color:var(--faint-2)}
img.av{object-fit:cover}
.pick-opt .av,.pick-new .av{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(var(--accent-rgb),.18);color:var(--accent-2)}
.pick-new .av svg,.pick-opt .av svg{width:14px;height:14px}
.pick-opt .tick{margin-left:auto;width:15px;height:15px;color:var(--brand);visibility:hidden}
.pick-opt[aria-selected=true] .tick{visibility:visible}
.pick-opt[aria-selected=true]{color:var(--text);background:var(--accent-soft)}

/* options panel */
.og{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ob{background:var(--muted);border-radius:12px;padding:12px 14px 14px;min-width:0}
.composer.compact .ob{background:var(--surface)}
.ob.wide{grid-column:1/-1}
.ot{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:10px}
.ot.cap-head{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.cap-head label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)}
.cap-head input{accent-color:var(--brand);margin:0}
.nsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nstep{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:10px;padding:10px 10px 8px}
.composer.compact .nstep{background:var(--muted)}
.nstep>span{font-size:12px;color:var(--faint)}
.nstep .ctl{display:flex;align-items:center;gap:6px}
.nstep .ctl button{flex:none;width:28px;height:28px;border-radius:8px;border:0;background:var(--muted);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.composer.compact .nstep .ctl button{background:var(--surface)}
.nstep .ctl button:hover,.nstep .ctl button:focus-visible{background:var(--brand);color:var(--on-solid)}
.nstep .ctl button svg{width:14px;height:14px}
.nstep input,.nstep input:focus{flex:1;min-width:0;height:30px;padding:0;border:0;background:transparent;text-align:center;font-size:20px;font-weight:700;color:var(--text);-moz-appearance:textfield}
.nstep input::-webkit-inner-spin-button,.nstep input::-webkit-outer-spin-button,.range input::-webkit-inner-spin-button,.range input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nstep .ctl i{font-style:normal;font-size:12px;color:var(--faint);width:10px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-o{display:flex;flex-direction:column;gap:7px;padding:6px 6px 8px;border:0;border-radius:10px;background:var(--surface);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background-color .15s ease,color .15s ease}
.composer.compact .tile-o{background:var(--muted)}
.tile-o:enabled:hover,.tile-o:focus-visible{background:var(--hover);color:var(--text)}
.tile-o[aria-pressed=true]{background:var(--brand-soft);color:var(--text)}
.cap-prev{height:54px;border-radius:7px;background:var(--frame);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-size:14px;line-height:1;color:var(--on-solid);letter-spacing:0;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.cap-prev b{font-weight:inherit}
.lay-prev{height:54px;border-radius:7px;background:var(--frame);display:grid;place-items:center}
.lay-prev .ph{position:relative;width:28px;height:48px;border-radius:4px;overflow:hidden;background:#4A3428}
.lay-prev .ph::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#B4643A,#5E3A2A);filter:blur(3px);opacity:.75}
.lay-prev .ph i{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.lay-prev.zoom .ph i{left:-6px;right:-6px;height:24px}
.lay-prev.crop .ph i,.lay-prev.left .ph i,.lay-prev.right .ph i,.lay-prev.gameplay .ph i{left:0;right:0;top:0;height:100%;transform:none}
.lay-prev.left .ph i{background:linear-gradient(90deg,var(--accent-2),var(--accent) 45%,#5E3A2A)}
.lay-prev.right .ph i{background:linear-gradient(270deg,var(--accent-2),var(--accent) 45%,#5E3A2A)}
.lay-prev.fit .ph{background:#000}.lay-prev.fit .ph::before{display:none}
.lay-prev.split .ph i{top:0;height:23px;transform:none}
.lay-prev.split .ph::before{inset:25px 0 0 0;filter:none;opacity:1;background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px}
.composer.compact .seg{background:var(--muted)}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 6px;border:0;border-radius:7px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.seg button small{font-size:11px;font-weight:500;color:var(--faint);transition:color .15s ease}
.seg button:hover,.seg button:focus-visible{background:var(--hover);color:var(--text)}
.seg button[aria-pressed=true]{background:var(--brand-soft);color:var(--text)}
.seg button[aria-pressed=true] small{color:var(--brand-text)}
.range{display:flex;align-items:center;gap:8px}
.range label{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:0 10px;height:44px;font-size:12px;color:var(--faint);min-width:0}
.composer.compact .range label{background:var(--muted)}
.range input,.range input:focus{flex:1;min-width:0;height:40px;border:0;background:transparent;padding:0;font-size:15px;font-weight:600;color:var(--text);-moz-appearance:textfield}
.range>svg{width:14px;height:14px;color:var(--faint);flex:none}
@media (max-width:640px){.og{grid-template-columns:1fr}.nsteps{grid-template-columns:1fr}}

/* ---------- home blocks */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-6);display:flex;flex-direction:column}
.tile i{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;margin-bottom:14px}
.tile i svg{width:18px;height:18px}
.tile b{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.1}
.tile span{font-size:13px;color:var(--dim);margin-top:2px}
/* ---------- dashboard: four numbers, then the work, then the people ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5)}
.stat{display:flex;align-items:center;gap:var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5)}
.stat-ico{flex:none;width:38px;height:38px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.stat-ico svg{width:var(--icon);height:var(--icon)}
.stat-tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.stat-tx b{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-tx span{font-size:var(--fs-xs);color:var(--dim)}
.stat-tx .stat-bad{color:var(--bad);font-weight:600}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr);gap:var(--sp-5);align-items:stretch;margin-bottom:var(--sp-5)}
.dash-grid>.card{margin-bottom:0}
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.sec-head h2{font-size:var(--fs-h2);font-weight:600;color:var(--text)}
.sec-head p{font-size:var(--fs-sm);color:var(--dim);margin-top:2px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;align-items:stretch}
.home-grid>.card:first-child{display:flex;flex-direction:column}
.home-grid>.card:first-child .chart{margin-top:auto}
.steps.across{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.home-grid>.card{margin-bottom:0}
.home-grid+.card,.home-grid+.card+.card{margin-top:16px}
.home-grid .ai-home{margin-bottom:0}
.kpis{display:flex;gap:24px;flex-wrap:wrap}
.kpi b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin:2px 0 12px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font:11px "Geist","Segoe UI",sans-serif;fill:var(--faint)}
.chart .b1{fill:var(--brand)}.chart .b2{fill:var(--text)}
.chart .none{font-size:13px;fill:var(--dim)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--r);background:var(--muted);border:0;cursor:pointer}
.step:active{background:var(--line)}
.set-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.set-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.set-link{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--dim);text-decoration:none;transition:background-color .15s ease,color .15s ease}
.set-link svg{flex:none;width:18px;height:18px;margin-top:2px}
.set-link b{display:block;font-size:14px;font-weight:600;color:var(--text)}
.set-link small{display:block;font-size:12px;color:var(--faint);line-height:1.4}
.set-link:hover{background:var(--muted)}
.set-link.on{background:var(--brand-soft)}.set-link.on svg{color:var(--brand-deep)}.set-link.on b{color:var(--text)}
.set-body{min-width:0;animation:rise .25s ease both}
.ai-form{display:grid;gap:18px;max-width:560px}
.ai-form select{width:100%}
.ai-form .with{display:flex;gap:8px}.ai-form .with input{flex:1;min-width:0}
.ai-form .hint{font-size:12px;font-weight:400;color:var(--dim)}
.ai-form .hint a{color:var(--brand-deep);font-weight:600}

.making{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--dim);font-size:13px;font-weight:500;background:linear-gradient(110deg,var(--muted) 30%,var(--surface-2) 50%,var(--muted) 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}

.clip-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}

.ttl{color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none;transition:background-color .15s ease}
.selck:hover{background:var(--brand-soft)}

#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px 12px 10px 18px;border-radius:14px;background:var(--frame);color:var(--frame-text);font-size:14px;border:1px solid var(--line)}

dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r-xl);box-shadow:var(--shadow-2);padding:0;max-width:calc(100vw - 32px)}

/* Clipsora 2.0 Pro Clip Workbench: Cinema 9:16 stage with safe-zone overlays & transport bar on the left,
   tabbed inspector on the right, and sticky approval/render actions at the bottom */
.editor{display:grid;grid-template-columns:minmax(320px,460px) minmax(440px,620px);grid-template-rows:minmax(0,1fr);height:calc(100vh - 36px);max-height:calc(100vh - 36px);background:var(--surface)}
.editor .stage-col{background:var(--frame);display:flex;flex-direction:column;min-height:0;overflow:hidden}

.editor .stage{display:grid;place-items:center;flex:1;min-height:240px;padding:12px;overflow:hidden}
.safe-wrap{position:relative;display:inline-grid;place-items:center;max-width:100%;max-height:calc(100vh - 190px);aspect-ratio:9/16;border-radius:var(--r-lg);overflow:hidden;background:#000}
.safe-wrap video,.safe-wrap img{width:100%;height:100%;object-fit:contain;display:block;border-radius:var(--r-lg);background:#000}
.safe-ov{position:absolute;inset:0;pointer-events:none;display:none;flex-direction:column;justify-content:space-between;z-index:3}
.safe-ov.on{display:flex}
.safe-top{height:12%;background:rgba(244,123,32,.14);border-bottom:1px dashed rgba(244,123,32,.75);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:600 10px/1 var(--font-mono);color:#ffb37a;text-transform:uppercase;letter-spacing:.06em}

.safe-rail i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);display:block}
.safe-bot{height:22%;background:rgba(244,123,32,.16);border-top:1px dashed rgba(244,123,32,.8);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font:600 10px/1 var(--font-mono);color:#ffb37a;text-transform:uppercase;letter-spacing:.06em}

.safe-ov.m-tiktok .safe-top{height:14%}.safe-ov.m-tiktok .safe-bot{height:27%}.safe-ov.m-tiktok .safe-rail i{width:32px;height:32px}
.editor .ed-facts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--frame-line);color:var(--frame-dim);font-family:var(--font-mono);font-size:var(--fs-2xs);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.editor .panel{padding:0;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}

.ed-tab:hover{background:var(--hover);color:var(--text)}

.ed-pane{display:none;flex-direction:column;gap:var(--sp-4)}
.ed-pane.on{display:flex}

.triage-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 12px}

@media (max-width:920px){.editor{grid-template-columns:1fr;grid-template-rows:minmax(260px,42vh) minmax(0,1fr);height:calc(100vh - 20px);max-height:calc(100vh - 20px)}.ed-keys{display:none}}

   samples the composer shows, grouped the same way */
.lookpick{position:relative}
.lp-btn{display:flex;align-items:center;gap:var(--sp-2);width:100%;height:var(--h);padding:0 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:inherit;font-size:var(--fs-sm);cursor:pointer;text-align:left;transition:border-color var(--dur-1) ease,background-color var(--dur-1) ease}

/* The decoration behind the hero. Drawn in warm ink on a light page and in shadow on a dark one, and drawn
   again whenever the theme changes, so it never leaves pale specks on a dark background. */
function drawHorizon() {
  const host = $("#appAscii");
  if (!host) return;
  if (typeof window._gaStop === "function") { try { window._gaStop(); } catch (e) { /* already stopped */ } }
  host.innerHTML = "";
  if (!window.GradientASCII) return;
  const dark = document.documentElement.dataset.theme === "dark";
  try {
    window._gaStop = GradientASCII(host, {
      colors: dark ? ["#4a3428", "#241c17", "#2e2622", "#20180f", "#2a201a"] : ["#ffb27a", "#ffffff", "#ffd2ae", "#ffe0c2", "#fff1e6"],
      shape: "horizon", lightMode: !dark, cellSize: 16, density: 0.8, glyphOpacity: 0.26, gradientOpacity: 0.32,
      glow: 0.06, grain: 0.06, mouseInteraction: false, clickEffect: "none" });
  } catch (e) { /* decoration only: a page without it still works */ }
}

/* Light or dark. The browser remembers the choice; until there is one, the system setting decides. */
function brandCfg() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("clipsora_brand") || "{}"); } catch {}
  const srv = S.status?.brand || {};
  return {
    name: (srv.name || saved.name || "").trim(),
    ig: (srv.ig || saved.ig || "").trim(),
    yt: (srv.yt || saved.yt || "").trim(),
    color: (srv.color || saved.color || "#F47B20").trim(),
    tagline: (srv.tagline || saved.tagline || "DAILY HIGH-SIGNAL PODCAST CLIPS").trim(),
    intro_cover: srv.intro_cover ?? saved.intro_cover ?? true,
    watermark: srv.watermark ?? saved.watermark ?? true,
    outro: srv.outro ?? saved.outro ?? true,
    has_logo: Boolean(srv.has_logo),
  };
}
function outroPreviewUrl(b) {
  const q = new URLSearchParams({
    brand_name: b.name || "",
    ig_handle: b.ig || "",
    yt_channel: b.yt || "",
    tagline: b.tagline || "",
    t: String(Date.now()),
  });
  return `/api/brand/outro-preview?${q.toString()}`;
}
function saveBrandCfg(patch) {
  const cur = {...brandCfg(), ...patch};
  try { localStorage.setItem("clipsora_brand", JSON.stringify(cur)); } catch {}

// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function sendBig(f, who, options) {
  const file = f.file;
  const s = await send("/api/upload/start", {name: file.name, size: file.size, options, creator: who});
  const sent = new Array(s.parts).fill(0);
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); drawAtt(); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));

    while (next < s.parts) {
      const i = next++;

        try { await put(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }

    await Promise.all([worker(), worker()]);
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; drawAtt();
  } catch (e) {
    next = s.parts;                                   // stop the other sender
    api(`/api/upload/${s.id}`, {method: "DELETE"}).catch(() => {});
    throw e;
  }
}

function drawJobs() {

  const cid = creatorId();
  let list = cid ? S.jobs.filter(j => j.creator === cid) : S.jobs;
  const liveBox = $("#live");
  if (liveBox) { const lj = list.find(j => j.status === "live");
    if (!liveBox.querySelector(".pick.open")) put(liveBox, lj ? liveHtml(lj) : "");  // don't redraw under an open menu
    list = list.filter(j => j.status !== "live"); }
  if (!list.length) {
    root.querySelectorAll("section").forEach(e => e.remove());
    if (!$(".empty", root)) root.innerHTML = `<div class="empty"><img src="/brand/favicon.svg?v=2" alt=""><b>${cid ? "No clips for this creator yet" : "No videos yet"}</b>${cid ? "Start recording their stream, or paste a link to one of their videos above." : "Paste a link above and the studio will find the best moments and turn them into clips."}</div>`;

function renderMarkdown(md) {
  const lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  let out = "", inUl = false, inOl = false, inTable = false;
  const closeLists = () => {
    if (inUl) { out += "</ul>"; inUl = false; }
    if (inOl) { out += "</ol>"; inOl = false; }
  };
  const closeTable = () => {
    if (inTable) { out += "</tbody></table>"; inTable = false; }
  };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i], t = raw.trim();
    if (!t) { closeLists(); closeTable(); continue; }
    if (/^---+$/.test(t)) { closeLists(); closeTable(); out += "<hr>"; continue; }
    const hm = t.match(/^(#{1,3})\s+(.*)$/);
    if (hm) {
      closeLists(); closeTable();
      const lvl = hm[1].length;
      out += `<h${lvl}>${inline(hm[2])}</h${lvl}>`;
      continue;
    }
    if (t.startsWith("|") && t.endsWith("|")) {
      closeLists();
      const cells = t.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (!inTable) {
        out += `<table><thead><tr>${cells.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>`;
        inTable = true;
      } else {
        out += `<tr>${cells.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`;
      }
      continue;
    }
    closeTable();
    const um = t.match(/^[-*]\s+(.*)$/);
    if (um) {
      if (inOl) { out += "</ol>"; inOl = false; }
      if (!inUl) { out += "<ul>"; inUl = true; }
      out += `<li>${inline(um[1])}</li>`;
      continue;
    }
    const om = t.match(/^\d+\.\s+(.*)$/);
    if (om) {
      if (inUl) { out += "</ul>"; inUl = false; }
      if (!inOl) { out += "<ol>"; inOl = true; }
      out += `<li>${inline(om[1])}</li>`;
      continue;
    }
    closeLists();
    out += `<p>${inline(t)}</p>`;
  }
  closeLists(); closeTable();
  return out || `<p class="help">Empty report.</p>`;
}

function applyLearnedProfile(p, quiet = false) {
  if (!p) return;
  const lp = LP(), cp = CP();
  const layoutKindMap = {
    "fill": "crop", "split-v": "split", "split-h": "side",
    "blur": "blur", "letterbox": "cinematic", "pip": "pip", "auto": "auto",
  };
  let nextLay = p.layout || layoutKindMap[p.layout_kind] || "";
  if (lp.length && !lp.some(l => l.id === nextLay)) {
    nextLay = layoutKindMap[p.layout_kind] || layoutKindMap[p.layout] || lp.find(l => l.kind === p.layout_kind)?.id || SEL_LAY;
  }
  if (nextLay) SEL_LAY = nextLay;
  const layOv = p.layout_overrides || p.layout_cfg || null;
  LAY_OVER = layOv && typeof layOv === "object" && Object.keys(layOv).length ? {...layOv} : null;

  const cap = p.caption_cfg || {};
  let nextStyle = cap.preset || p.style || SEL_STYLE;
  if (cp.length && !cp.some(x => x.id === nextStyle)) {
    const anim = String(cap.animation || "").toLowerCase();
    nextStyle = cp.find(x => x.id === anim)?.id || (anim === "karaoke" ? "karaoke" : anim === "fade" ? "cinematic" : "bounce");
  }
  if (nextStyle) SEL_STYLE = nextStyle;

  const capOv = {};
  const fontVal = String(cap.font || cap.mapped_font || "").toLowerCase();
  if (["poppins", "anton", "archivo"].includes(fontVal)) capOv.font = fontVal;
  if (cap.base && /^#[0-9a-f]{6}$/i.test(cap.base)) capOv.base = cap.base;
  if (cap.active && /^#[0-9a-f]{6}$/i.test(cap.active)) capOv.active = cap.active;
  if (cap.position) {
    const pos = cap.position === "center" ? "middle" : cap.position;
    if (["top", "middle", "bottom"].includes(pos)) capOv.position = pos;
  }
  if (cap.transform || cap.casing) {
    const tr = (cap.transform || cap.casing) === "normal" ? "none" : (cap.transform || cap.casing);
    if (["upper", "none", "title"].includes(tr)) capOv.transform = tr;
  }
  if (cap.max_words || cap.words_per_line) {
    const mw = Number(cap.max_words || cap.words_per_line);
    if (mw >= 1 && mw <= 6) capOv.max_words = mw;
  }
  if (cap.animation && ["none", "pop", "bounce", "fade", "slide", "typewriter", "karaoke", "scale", "glitch"].includes(cap.animation)) {
    capOv.animation = cap.animation;
  }
  if (cap.box && /^#[0-9a-f]{6}$/i.test(cap.box)) capOv.box = cap.box;
  if (cap.box_opacity != null && !Number.isNaN(Number(cap.box_opacity))) capOv.box_opacity = Number(cap.box_opacity);
  if (cap.outline_colour && /^#[0-9a-f]{6}$/i.test(cap.outline_colour)) capOv.outline_colour = cap.outline_colour;
  for (const [k, lo, hi] of [["size", 40, 220], ["outline", 0, 14], ["shadow", 0, 10], ["anim_ms", 0, 600], ["intensity", 0, 100]]) {
    if (cap[k] != null && !Number.isNaN(Number(cap[k]))) capOv[k] = Math.max(lo, Math.min(hi, Number(cap[k])));
  }
  if (cap.highlight && ["word", "none"].includes(cap.highlight)) capOv.highlight = cap.highlight;
  CAP_OVER = Object.keys(capOv).length ? capOv : null;

  try { localStorage.setItem("clipsora_active_learned_style", JSON.stringify(p)); } catch {}
  if ($("#o_layout")) $("#o_layout").value = SEL_LAY;
  if ($("#o_style")) $("#o_style").value = SEL_STYLE;
  if ($("#styleLib") || $("#layoutLib")) paintCapPanels();
  else syncCfg();

  if (!quiet) {
    toast(`Applied "${p.label || "Learned Style"}" — ready in Overview & Videos.`, "ok");
    if (S.view === "learn") drawLearnedStylesGrid();
  }
}

  const hookTxt = [m.hookStyle, m.hookDur].filter(Boolean).join(" · ") || "Dynamic";
  return `<div class="sl-telem">
    <div class="sl-stat"><small>Pacing</small><b title="${esc(pacingTxt)}">${esc(pacingTxt)}</b></div>
    <div class="sl-stat"><small>Duration</small><b>${esc(durTxt)}</b></div>

function scoreBreakdownHtml(c) {
  if (!c.score && !c.criteria_scores && !c.scores && !c.score_breakdown) return "";
  let s = c.criteria_scores || c.scores || c.score_breakdown;
  if (!s || s.hook_strength == null) {
    const sc = Number(c.score) || 75;
    s = {
      hook_strength: Math.round((sc * 25) / 100),
      emotional_impact: Math.round((sc * 20) / 100),
      context_clarity: Math.round((sc * 20) / 100),
      value: Math.round((sc * 15) / 100),
      retention: Math.round((sc * 10) / 100),
      ending_impact: Math.round((sc * 10) / 100),
    };
  }
  return `<section class="ed-card">
    <div class="ed-card-h"><h3>Viral Intelligence Score</h3><span class="badge ${scoreCls(c.score)}" style="position:static">${c.score || 0}/100</span></div>
    <div class="hbar" style="margin-top:8px">
      <div class="hbar-row"><div class="top"><span>Opening hook strength (25%)</span><span>${s.hook_strength ?? "–"} / 25</span></div>
        <div class="track"><i style="width:${((s.hook_strength || 0) / 25) * 100}%"></i></div></div>
      <div class="hbar-row"><div class="top"><span>Emotional impact / curiosity (20%)</span><span>${s.emotional_impact ?? "–"} / 20</span></div>
        <div class="track"><i style="width:${((s.emotional_impact || 0) / 20) * 100}%"></i></div></div>
      <div class="hbar-row"><div class="top"><span>Context & clarity (20%)</span><span>${s.context_clarity ?? "–"} / 20</span></div>
        <div class="track"><i style="width:${((s.context_clarity || 0) / 20) * 100}%"></i></div></div>
      <div class="hbar-row"><div class="top"><span>Value (educational / entertaining) (15%)</span><span>${s.value ?? "–"} / 15</span></div>
        <div class="track"><i style="width:${((s.value || 0) / 15) * 100}%"></i></div></div>
      <div class="hbar-row"><div class="top"><span>Retention potential (10%)</span><span>${s.retention ?? "–"} / 10</span></div>
        <div class="track"><i style="width:${((s.retention || 0) / 10) * 100}%"></i></div></div>
      <div class="hbar-row"><div class="top"><span>Ending impact (10%)</span><span>${s.ending_impact ?? "–"} / 10</span></div>
        <div class="track"><i style="width:${((s.ending_impact || 0) / 10) * 100}%"></i></div></div>
    </div>
    ${c.reason ? `<p class="help" style="margin-top:8px"><b>Analysis:</b> ${esc(c.reason)}</p>` : ""}
    ${(c.transcript_evidence || c.evidence) ? `<p class="help" style="margin-top:4px;font-style:italic">"${esc(c.transcript_evidence || c.evidence)}"${c.speaker ? " — " + esc(c.speaker) : ""}</p>` : ""}
    ${(() => { const q = c.quality_check || c.quality; if (!q) return ""; const ok = q.ok ?? q.passed; const dims = q.width && q.height ? `${q.width}x${q.height}${q.fps ? " · " + q.fps + "fps" : ""}` : ""; return `<div class="row" style="margin-top:6px;gap:6px"><span class="pill ${ok ? "ok" : "warn"} sm">Quality: ${ok ? "Passed" : "Checked"}</span>${dims ? `<span class="sub">${esc(dims)}</span>` : ""}</div>`; })()}
  </section>`;
}

// the length of the clip as it is being edited, so a trimmed end never needs mental arithmetic
function clipLength() {
  const a = Number($('#clipdlg [data-f="start"]')?.value), b = Number($('#clipdlg [data-f="end"]')?.value);
  return isFinite(a) && isFinite(b) ? fmt(Math.max(0, b - a)) : "—";
}
function updateDlen() {
  const a = Number($('#clipdlg [data-f="start"]')?.value), b = Number($('#clipdlg [data-f="end"]')?.value);
  const len = $("#dlen"); if (len && isFinite(a) && isFinite(b)) len.textContent = `${fmt(a)} → ${fmt(b)}`;
  const facts = $("#clipdlg .ed-facts > span:first-child"); if (facts) facts.textContent = `${capLabel(D.style)} · ${layLabel(D.layout)} · ${clipLength()}`;
}
$("#clipdlg").addEventListener("close", () => { $("#clipdlg").innerHTML = ""; D.jid = null; D.cap = null; });
$("#clipdlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.addEventListener("keydown", e => {
  const dlg = $("#clipdlg");
  if (!dlg || !dlg.open || !D.jid) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const ae = document.activeElement, tag = (ae?.tagName || "").toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || ae?.isContentEditable) return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") {
    if (tag === "BUTTON" || tag === "A" || tag === "SUMMARY") return;
    e.preventDefault();
    const v = $("#stagevid"); if (v) v.paused ? v.play() : v.pause();
  } else if (k === "j" || (e.key === "ArrowRight" && ae?.id !== "stagevid")) {
    e.preventDefault();
    const btn = $('#clipdlg [data-act="nextclip"]'); if (btn && !btn.disabled) btn.click();
  } else if (k === "k" || (e.key === "ArrowLeft" && ae?.id !== "stagevid")) {
    e.preventDefault();
    const btn = $('#clipdlg [data-act="prevclip"]'); if (btn && !btn.disabled) btn.click();
  } else if (k === "a") {
    e.preventDefault();
    $('#clipdlg [data-act="dlgappr"]')?.click();
  } else if (k === "r") {
    e.preventDefault();
    $('#clipdlg [data-act="dlgreject"]')?.click();
  } else if (k === "s") {
    e.preventDefault();
    $('#clipdlg [data-act="safezone"]')?.click();
  } else if (k === "1" || k === "2" || k === "3") {
    const vbtn = $(`#clipdlg [data-act="usevar"][data-i="${Number(k) - 1}"]`);
    if (vbtn) { e.preventDefault(); vbtn.click(); }
  }
});

/* ============================================================ render + polling */
function render() {
  drawShell(); drawJobs(); drawStream(); drawSelBar();
  if (S.view === "overview") drawOverview();
  if ($("#clog")) drawLog();
  if (D.jid) drawClipDlg(false);
}
async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

document.addEventListener("change", async e => {
  const t = e.target;
  // a different style or layout starts from that preset: the last one's fine-tuning must not follow it
  if (D.jid && t.dataset.f === "style") { D.style = t.value; D.capOver = null; paintCapPanels(); const f = $("#clipdlg .ed-facts > span:first-child"); if (f) f.textContent = `${capLabel(D.style)} · ${layLabel(D.layout)} · ${clipLength()}`; }
  if (D.jid && t.dataset.f === "layout") {
    D.layout = t.value; D.layOver = null; paintCapPanels();

    const f = $("#clipdlg .ed-facts > span:first-child"); if (f) f.textContent = `${capLabel(D.style)} · ${layLabel(D.layout)} · ${clipLength()}`;
  }
  if (D.jid && (t.dataset.f === "start" || t.dataset.f === "end")) updateDlen();
  if (t.id === "o_creator") {
    const toggle = $("#o_captions"), c = S.creators.find(c => c.id === t.value);
    if (!toggle.dataset.overridden) { toggle.checked = c?.captions !== false; syncCaptionStyle(toggle); }
    const hk = $("#o_hook"); if (hk && !hk.dataset.typed) hk.value = c?.hook_text || "";      // the creator's own text, unless one was typed here
    const ds = $("#o_desc"); if (ds && !ds.dataset.typed) ds.value = c?.description_text || "";
    return;
  }
  if (t.id === "o_hook" || t.id === "o_desc") t.dataset.typed = "1";
  if (t.hasAttribute("data-caption-toggle")) {
    if (t.id === "o_captions") t.dataset.overridden = "true";
    syncCaptionStyle(t);
  }
  if (t.id === "ai_provider") { $("#ai_models").innerHTML = ""; if (S.ai && t.value !== S.ai.provider) { $("#ai_model").value = ""; $("#ai_base").value = ""; } return aiHints(); }
  if (t.dataset.sel) {
    const k = t.dataset.sel;
    if (t.checked) sel().add(k); else sel().delete(k);
    if (k.startsWith("j:")) (jobOf(k.slice(2))?.clips || []).forEach(c => sel().delete(`c:${k.slice(2)}:${c.id}`));   // the video covers its clips
    return render();
  }
  if (t.dataset.every !== undefined) {
    const cid = t.dataset.every; if (!cid) return toast("This recording isn't filed under a creator.", "bad");
    try { await send(`/api/creators/${cid}`, {ai_every_min: Number(t.value)}, "PUT"); toast(`AI checks every ${t.value} min`, "ok"); tick(); }
    catch (err) { toast(err.message, "bad"); }
    return;
  }
  if (t.dataset.k === "ai_every_min" && $("#costhint")) $("#costhint").textContent = costHint(Number(t.value));
  if (t.name === "mainch") return;  // saved by its own click handler
  if (t.closest("#cform") && t.type === "radio") { $$("#cform .plan").forEach(l => l.classList.toggle("on", l.contains(t))); return saveCreator(true); }
  if (!t.closest("#cform") || t.type !== "checkbox") return;
  if (t.dataset.k === "autopost" && t.checked && !await ask("Turn on auto-posting?", "Clips that score high enough will be posted to the ticked accounts without you seeing them first.", "Turn on")) { t.checked = false; return; }
  saveCreator(true);
